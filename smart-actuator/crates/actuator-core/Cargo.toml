[package]
name = "actuator-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
# NOTE: do NOT use `tokio = { workspace = true, ... }` here. The workspace
# definition has features = ["full"], which is additive and pulls in tokio's
# signal/process modules — those depend on signal-hook-registry, which does
# not compile for xtensa-esp32-espidf (the firmware target). actuator-core is
# shared by the firmware, so we declare tokio directly with default-features
# disabled and only the features we actually use.
tokio = { version = "1", default-features = false, features = ["sync"] }
tracing.workspace = true
async-trait.workspace = true
