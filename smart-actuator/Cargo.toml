[workspace]
resolver = "2"
members = [
    "crates/actuator-proto",
    "crates/actuator-core",
    "crates/actuator-plant",
    "crates/actuator-sim",
    "crates/controller-sidecar",
]
# actuator-firmware targets xtensa-esp32-espidf and requires the esp toolchain
# installed by espup. actuator-wasm targets wasm32 and is built via wasm-pack.
# Both are excluded so `cargo build --workspace` on a host machine succeeds
# without those toolchains installed.
exclude = ["crates/actuator-firmware", "crates/actuator-wasm"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/ambient-labs/smart-actuator"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }

# gRPC
tonic = "0.13"
prost = "0.13"

# serialisation / config
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

# error handling
thiserror = "2"
anyhow = "1"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# CLI
clap = { version = "4", features = ["derive"] }

# async trait support
async-trait = "0.1"

# async utilities
tokio-stream = { version = "0.1", features = ["net", "sync"] }
futures = "0.3"

# internal crates
actuator-proto = { path = "crates/actuator-proto" }
actuator-core = { path = "crates/actuator-core" }
