[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "actuator_sim"
version = "0.1.0"
description = "Actuator simulation CLI"
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.1",
    "pydantic==2.13.4",
    "loguru==0.7.3",
    "PyYAML==6.0.3",
    "grpcio>=1.68.0",
    "grpcio-tools>=1.68.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["actuator_sim/interface/actuator_pb2*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project.scripts]
actuator_sim = "actuator_sim.main:cli"

[tool.setuptools.packages.find]
include = ["actuator_sim*"]
