[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brain"
version = "0.1.0"
description = "Smart actuator brain — control logic and configuration"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7",
    "pydantic>=2.0",
]

[project.scripts]
brain = "brain.main:main"

[tool.hatch.build.targets.wheel]
packages = ["brain"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.4",
    "mypy>=2.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
