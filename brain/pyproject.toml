[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brain"
version = "0.1.0"
description = "Smart actuator brain — control logic and configuration"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7",
    "pydantic>=2.0",
    "fastapi>=0.136",
    "uvicorn>=0.34",
    "websockets>=13",
    "grpcio>=1.68",
    "grpcio-tools>=1.68",
    "PyYAML>=6.0",
    "aiosqlite>=0.20",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "bcrypt>=5.0",
    "greenlet>=3.5",
    "result>=0.17",
    "pyjwt[crypto]>=2.8",
    "cryptography>=48.0",
    "async-lru>=2.3",
]

[project.scripts]
brain = "brain.main:main"

[tool.hatch.build.targets.wheel]
packages = ["brain"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15",
    "mypy>=2.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"brain/interface/grpc/generated/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
