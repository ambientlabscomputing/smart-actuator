id: scara_rrpr
name: "4-DOF SCARA"
version: "1.0.0"
publisher: ambient-labs
summary: >
  A 4-DOF Selective Compliance Assembly Robot Arm (SCARA): a prismatic
  column lifts the whole arm along Z, two parallel vertical-axis revolute
  joints (shoulder, elbow) give fast, compliant XY reach, and a final
  revolute joint sets tool yaw. Classic SCARA configuration for
  pick-and-place and assembly work — same geometry family as Adept/Epson
  desktop SCARA arms, where the Z stage rides under the shoulder rather
  than plunging at the wrist.

brain_compatibility: ">=0.1.0"
firmware_compatibility: ">=0.1.0"

# ── End-effector ──────────────────────────────────────────────────────────────
# The TCP is at the wrist joint origin — no additional tool offset by default.
# task_space: se3 — full position + tool-yaw IK. Because every joint axis is
# parallel to world +Z, the chain can never produce roll/pitch (only yaw), so
# any pose reachable via this chain's own FK always has roll = pitch = 0 and
# is exactly solvable — se3 here is "position + yaw", not general orientation.
end_effector:
  parent: wrist
  offset_m: [0.0, 0.0, 0.0]
  orientation_offset_deg: [0.0, 0.0, 0.0]
  task_space: se3

# ── IK solver hints ───────────────────────────────────────────────────────────
# DH parameters for this arm:
#   Joint 0 (lift):     a=0,  α=0°, prismatic  — vertical Z column
#   Joint 1 (shoulder): a=a0, α=0°, d=0        — first planar link
#   Joint 2 (elbow):    a=a1, α=0°, d=0        — second planar link
#   Joint 3 (wrist):    a=0,  α=0°, d=0        — tool yaw
#
# The shoulder/elbow pair alone is a textbook planar_2r problem, but the
# planar_2r block solver only covers a 2-joint sub-chain and this template
# needs Z + XY + yaw solved together. A single numeric block (same choice
# made for six_dof_anthro_spherical_wrist and seven_dof_dlr) gives correct,
# well-converging solutions across the workspace without a bespoke
# closed-form SCARA block solver.
ik:
  decomposition:
    - kind: numeric
      joints: [0, 1, 2, 3]

  numeric:
    max_iters: 150
    pos_tol_m: 1.0e-4
    rot_tol_rad: 1.0e-3
    damping: 0.01
    seed: current_q

  redundancy:
    nullspace_objective: keep_near_seed

# ── Joint slots ───────────────────────────────────────────────────────────────
joints:
  - slot: 0
    name: lift
    axis: z
    parent: base
  - slot: 1
    name: shoulder
    axis: z
    parent: lift
  - slot: 2
    name: elbow
    axis: z
    parent: shoulder
  - slot: 3
    name: wrist
    axis: z
    parent: elbow

# ── DH kinematics (source of truth) ──────────────────────────────────────────
# Convention (matches ArmCanvas and brain/service/dh_fk.py):
#   T_i = T_{i-1} · Rz(θ_offset + θ_i) · Tz(d) · Tx(a) · Rx(α)
#
# Desktop-SCARA-scale defaults; user can adjust in the Advanced tab.
dh:
  link_radius:
    default: 0.025
    min: 0.005
    max: 0.08
    unit: m
    editable: true

  joints:
    # ── Joint 0: lift (prismatic Z column — raises the whole arm) ───────────
    - name: lift
      slot: 0
      type: prismatic
      axis: z
      a:
        default: 0.0
        unit: m
        editable: false
      d:
        default: 0.0
        unit: m
        editable: false
      alpha:
        default: 0.0
        unit: deg
        editable: false
      theta_offset:
        default: 0.0
        unit: deg
        editable: false
      limit_lower:
        default: 0.0
        min: 0.0
        max: 0.0
        unit: m
        editable: false
      limit_upper:
        default: 0.15
        min: 0.02
        max: 0.5
        unit: m
        editable: true
      mass:
        default: 1.2
        min: 0.1
        max: 20.0
        unit: kg
        editable: true

    # ── Joint 1: shoulder (first planar link, length = a0) ──────────────────
    - name: shoulder
      slot: 1
      type: revolute
      axis: z
      a:
        default: 0.25
        min: 0.05
        max: 1.0
        unit: m
        editable: true
      d:
        default: 0.0
        unit: m
        editable: false
      alpha:
        default: 0.0
        unit: deg
        editable: false
      theta_offset:
        default: 0.0
        unit: deg
        editable: true
      limit_lower:
        default: -150.0
        min: -180.0
        max: 0.0
        unit: deg
        editable: true
      limit_upper:
        default: 150.0
        min: 0.0
        max: 180.0
        unit: deg
        editable: true
      mass:
        default: 0.8
        min: 0.1
        max: 20.0
        unit: kg
        editable: true

    # ── Joint 2: elbow (second planar link, length = a1) ────────────────────
    - name: elbow
      slot: 2
      type: revolute
      axis: z
      a:
        default: 0.22
        min: 0.05
        max: 1.0
        unit: m
        editable: true
      d:
        default: 0.0
        unit: m
        editable: false
      alpha:
        default: 0.0
        unit: deg
        editable: false
      theta_offset:
        default: 0.0
        unit: deg
        editable: true
      limit_lower:
        default: -150.0
        min: -180.0
        max: 0.0
        unit: deg
        editable: true
      limit_upper:
        default: 150.0
        min: 0.0
        max: 180.0
        unit: deg
        editable: true
      mass:
        default: 0.5
        min: 0.1
        max: 20.0
        unit: kg
        editable: true

    # ── Joint 3: wrist (tool yaw, no additional link) ───────────────────────
    - name: wrist
      slot: 3
      type: revolute
      axis: z
      a:
        default: 0.0
        unit: m
        editable: false
      d:
        default: 0.0
        unit: m
        editable: false
      alpha:
        default: 0.0
        unit: deg
        editable: false
      theta_offset:
        default: 0.0
        unit: deg
        editable: true
      limit_lower:
        default: -360.0
        min: -720.0
        max: 0.0
        unit: deg
        editable: true
      limit_upper:
        default: 360.0
        min: 0.0
        max: 720.0
        unit: deg
        editable: true
      mass:
        default: 0.15
        min: 0.01
        max: 5.0
        unit: kg
        editable: true

# ── Easy-mode aliases ─────────────────────────────────────────────────────────
easy:
  - legacy_param: lift_travel_m
    label: "Z column travel (m)"
    unit: m
    description: "Total vertical travel of the base column that lifts the arm"
    target: joints[0].limit_upper

  - legacy_param: upper_arm_length_m
    label: "Upper arm length (m)"
    unit: m
    description: "Length of the upper arm — shoulder to elbow (a0)"
    target: joints[1].a

  - legacy_param: forearm_length_m
    label: "Forearm length (m)"
    unit: m
    description: "Length of the forearm — elbow to wrist (a1)"
    target: joints[2].a

  - legacy_param: link_radius_m
    label: "Link radius (m)"
    unit: m
    description: "Visual / collision cylinder radius for all links"
    target: link_radius

  - legacy_param: shoulder_limit_deg
    label: "Shoulder travel (±°)"
    unit: deg
    description: "Symmetric travel limit for the shoulder joint"
    target: joints[1].limit_symmetric

  - legacy_param: elbow_limit_deg
    label: "Elbow travel (±°)"
    unit: deg
    description: "Symmetric travel limit for the elbow joint"
    target: joints[2].limit_symmetric

  - legacy_param: wrist_limit_deg
    label: "Wrist travel (±°)"
    unit: deg
    description: "Symmetric travel limit for the tool-yaw wrist joint"
    target: joints[3].limit_symmetric

# ── Legacy parameter schema ───────────────────────────────────────────────────
parameters:
  - name: lift_travel_m
    label: "Z column travel (m)"
    type: float
    default: 0.15
    min: 0.02
    max: 0.5
    unit: m
    description: "Total vertical travel of the base column that lifts the arm"

  - name: upper_arm_length_m
    label: "Upper arm length (m)"
    type: float
    default: 0.25
    min: 0.05
    max: 1.0
    unit: m
    description: "Length of the upper arm — shoulder to elbow (a0)"

  - name: forearm_length_m
    label: "Forearm length (m)"
    type: float
    default: 0.22
    min: 0.05
    max: 1.0
    unit: m
    description: "Length of the forearm — elbow to wrist (a1)"

  - name: link_radius_m
    label: "Link radius (m)"
    type: float
    default: 0.025
    min: 0.005
    max: 0.08
    unit: m
    description: "Cylinder radius for all links"

  - name: shoulder_limit_deg
    label: "Shoulder travel (±°)"
    type: float
    default: 150.0
    min: 10.0
    max: 180.0
    unit: deg
    description: "Symmetric travel limit for the shoulder joint"

  - name: elbow_limit_deg
    label: "Elbow travel (±°)"
    type: float
    default: 150.0
    min: 10.0
    max: 180.0
    unit: deg
    description: "Symmetric travel limit for the elbow joint"

  - name: wrist_limit_deg
    label: "Wrist travel (±°)"
    type: float
    default: 360.0
    min: 10.0
    max: 720.0
    unit: deg
    description: "Symmetric travel limit for the tool-yaw wrist joint"
