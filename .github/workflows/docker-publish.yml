name: Build & publish Docker image

on:
  push:
    branches:
      - develop
    tags:
      # Bare semver only — no leading 'v'. e.g. 1.1.1, 2.0.0
      - "[0-9]+.[0-9]+.[0-9]+"
  # Build a specific branch on demand; the sanitised branch name becomes the tag
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build (e.g. feature/my-branch). The branch name becomes the image tag."
        required: true
        default: "develop"

env:
  IMAGE_REPO: ghcr.io/ambientlabscomputing/smart-actuator

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          # For manual dispatch, check out the requested branch
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || '' }}

      - name: Log in to GHCR
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagging rules:
      #
      #   push to develop   → :<sha7>   :latest
      #   workflow_dispatch → :<branch> (slashes → dashes, lowercased)
      #   semver tag 1.1.1  → :1.1.1   :1.1   :1
      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          SHA7="${GITHUB_SHA::7}"
          REPO="${{ env.IMAGE_REPO }}"
          EVENT="${{ github.event_name }}"

          TAGS_TO_PUSH=()

          if [[ "${EVENT}" == "workflow_dispatch" ]]; then
            # Sanitise branch name: lower-case, replace '/' and any non-[a-z0-9._-] with '-'
            BRANCH_TAG=$(echo "${{ inputs.branch }}" \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's|[^a-z0-9._-]|-|g' \
              | sed 's|-\+|-|g' \
              | sed 's|^-||;s|-$||')
            TAGS_TO_PUSH+=("${REPO}:${BRANCH_TAG}")

          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Bare semver tag e.g. "1.1.1"
            SEMVER="${GITHUB_REF_NAME}"
            MAJOR="${SEMVER%%.*}"                          # 1
            MINOR="${SEMVER%.*}"                           # 1.1
            TAGS_TO_PUSH+=("${REPO}:${SEMVER}")           # 1.1.1
            TAGS_TO_PUSH+=("${REPO}:${MINOR}")            # 1.1
            TAGS_TO_PUSH+=("${REPO}:${MAJOR}")            # 1

          else
            # Push to develop branch
            TAGS_TO_PUSH+=("${REPO}:${SHA7}")
            TAGS_TO_PUSH+=("${REPO}:latest")
          fi

          # Join the array as a newline-delimited string for downstream steps
          TAGS_STR=$(printf '%s\n' "${TAGS_TO_PUSH[@]}")
          echo "tags<<EOF"          >> "$GITHUB_OUTPUT"
          echo "${TAGS_STR}"        >> "$GITHUB_OUTPUT"
          echo "EOF"                >> "$GITHUB_OUTPUT"

          # The first tag in the list is what we pass to 'make docker-build'
          echo "primary_tag=${TAGS_TO_PUSH[0]##*:}" >> "$GITHUB_OUTPUT"

          echo "### Tags to publish" >> "$GITHUB_STEP_SUMMARY"
          printf '```\n%s\n```\n' "${TAGS_STR}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build image
        run: |
          make docker-build \
            IMAGE_REPO="${{ env.IMAGE_REPO }}" \
            IMAGE_TAG="${{ steps.tags.outputs.primary_tag }}"

      - name: Tag & push all aliases
        run: |
          PRIMARY="${{ env.IMAGE_REPO }}:${{ steps.tags.outputs.primary_tag }}"
          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            if [[ "${tag}" != "${PRIMARY}" ]]; then
              docker tag "${PRIMARY}" "${tag}"
            fi
            docker push "${tag}"
          done <<< "${{ steps.tags.outputs.tags }}"
